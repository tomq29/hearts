services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: hearts_api
    ports:
      - "8080:8080"
    environment:
      - HEARTS_DATABASE_URL=${HEARTS_DATABASE_URL}
      - HEARTS_STORAGE_ENDPOINT=minio:9000
      - HEARTS_STORAGE_ACCESS_KEY_ID=${HEARTS_STORAGE_ACCESS_KEY_ID}
      - HEARTS_STORAGE_SECRET_ACCESS_KEY=${HEARTS_STORAGE_SECRET_ACCESS_KEY}
      - HEARTS_STORAGE_USE_SSL=false
      - HEARTS_STORAGE_BUCKET_NAME=hearts-photos
      - HEARTS_STORAGE_LOCATION=us-east-1
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - KAFKA_BROKERS=${KAFKA_BROKERS}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./apps/notification-service
      dockerfile: Dockerfile
    container_name: hearts_notification_service
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      # kafka:29092 is the internal listener; the 9092 listener advertises
      # itself as localhost, which is unreachable from another container.
      - KAFKA_BROKERS=${KAFKA_BROKERS}
      # Verifies the API's access tokens on the notification stream. Shared
      # HS256 secret for now — see TODO.md for the move to asymmetric keys.
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - PORT=8081
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}

  minio:
    image: minio/minio:latest
    container_name: hearts_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:15-alpine
    container_name: hearts_postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    # KRaft mode: the broker manages its own metadata, no Zookeeper needed.
    image: confluentinc/cp-kafka:7.7.1
    container_name: hearts_kafka
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      # Any fixed 22-char base64 id; identifies this single-node cluster's storage
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg

volumes:
  minio_data:
  postgres_data:
